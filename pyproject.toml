[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dvlhg"
version = "0.1.0"
description = "Diffusion-Augmented Vision-Language Hypergraph Network for Lung Disease Diagnosis"
requires-python = ">=3.9"
dependencies = [
    "numpy", "pandas", "scipy", "scikit-learn", "Pillow",
    "pyyaml", "tqdm", "matplotlib",
]

[project.scripts]
dvlhg = "dvlhg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dvlhg = ["../../configs/*.yaml"]
